<html>

<head>
  <meta charset="utf-8">
  <title>sample_info</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="../../js/info-message.js"></script>
</head>

<body>
  <a-scene background="color: yellow" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: raycastable"
    info-message="htmlSrc: #messageText">
    <a-assets>
      <!-- INFOの中身 -->
      <a-asset-item id="messageText" src="message.html"></a-asset-item>
      <img id="detail" src="../../../src/assets/detail.png">
    </a-assets>

    <!-- background -->
     <a-entity id="background"></a-entity>

    <!-- camera -->
    <a-entity position="0 1.6 0" camera
      look-controls="magicWindowTrackingEnabled: false; touchEnabled: true">
      <a-entity id="fadeBackground" geometry="primitive: sphere; radius: 2.5"
        material="color: black; side: back; shader: flat; transparent: true; opacity: 0.6" visible="false">
      </a-entity>
    </a-entity>

    <!-- detailBtn -->
    <a-entity id="infoBtn" geometry="primitive: plane; height:1; width:1"
      material="shader: standard; src: #detail; transparent: true" position="0 1.5 -2" scale="0.5 0.5 0.5"></a-entity>

    <!-- infoPanel 初期値はvisible="false" -->
    <a-entity id="infoPanel" position="0 1.5 -1" info-panel geometry="primitive: plane; width:0.5; height:0.5"
      material="color: green; opacity: 0.3">
    </a-entity>


    <!-- 日本語をa-textで描画 -->
    <a-text id="JPtext" rotation="0 0 0" position="0 2 -1" scale="0.5 0.5 0.5" value="we are ざじゃぱにーずゴプリン"
      font="../../../src/assets/noto-sans-cjk-jp-msdf.json" font-image="../../../src/assets/noto-sans-cjk-jp-msdf.png"
      negate="false" color="red" align="center">
    </a-text>
  </a-scene>
</body>

</html>
