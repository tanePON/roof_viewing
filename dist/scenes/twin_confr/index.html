<!-- 参考 https://github.com/aframevr/aframe/blob/master/examples/boilerplate/3d-model/index.html -->
<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>web版 confR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>

<body>
  <a-scene stats loading-screen="dotsColor: gray; backgroundColor: lightgray">

    <!-- Sky, Emvironment -->
    <a-sky color="#ECECEC"></a-sky>
    <a-entity environment="preset: default; dressingAmount: 30"></a-entity>

    <!-- Assets -->
    <a-assets>
      <!-- <a-asset-item id="confR" src="../../../src/assets/confR_glTF.glb"></a-asset-item> -->
      <a-asset-item id="confR" src="../../../src/assets/confR_glTF.glb"></a-asset-item>
    </a-assets>

    <!-- glTF -->
    <!-- <a-gltf-model src="#confR" position="0 -1.5 0" rotation="0 45 0" scale="0.01 0.01 0.01"></a-gltf-model> -->
    <a-gltf-model src="#confR" position="0 -1.5 0" rotation="0 45 0" scale="0.01 0.01 0.01"></a-gltf-model>
  </a-scene>
</body>

</html>
